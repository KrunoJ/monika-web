<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/images/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/assets/images/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/assets/images/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
    <title>Stranica nije pronađena - Monika Jagić</title>
    <meta
      name="description"
      content="Tražena stranica ne postoji. Vrati se na početnu Monike Jagić."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css?v=seo-404" />
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Preskoči na sadržaj</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="logo" href="/" aria-label="Monika Jagić početna">
          <img
            class="logo__mark"
            src="/assets/images/logo-monika.webp"
            alt=""
            width="480"
            height="659"
          />
        </a>
        <nav class="nav-desktop" aria-label="Glavna navigacija">
          <div class="nav-desktop__links">
            <a class="nav-link" href="/">Početna</a>
            <a class="nav-link" href="/biznis-okvir/">Biznis okvir</a>
            <a class="nav-link" href="/newsletter-sustav/">Newsletter sustav</a>
            <a class="nav-link" href="/o-meni/">O meni</a>
          </div>
          <a class="nav-cta" href="/#upitnik" data-ga-event="cta_click" data-ga-location="nav">
            Krenimo od tvoje situacije
          </a>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="section" aria-labelledby="err-title">
        <div class="container reveal" style="padding-block: clamp(4rem, 12vw, 7rem)">
          <p class="section-label">// 404</p>
          <h1 id="err-title" class="display" style="max-width: 14ch">
            ova stranica ne postoji
          </h1>
          <p class="lede" style="margin-top: var(--space-4); max-width: 36rem">
            Link je možda zastario ili je adresa krivo upisana. Vrati se na početnu i
            nastavi od tamo.
          </p>
          <p style="margin-top: var(--space-6)">
            <a
              class="btn btn--primary"
              href="/"
              data-ga-event="cta_click"
              data-ga-location="404_home"
              >Natrag na početnu</a
            >
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <div class="site-footer__legal">
          <p class="site-footer__copy">© <span data-year></span> Monika Jagić</p>
          <nav class="site-footer__legal-nav" aria-label="Pravne informacije">
            <a href="/podaci-o-poslovanju/">Podaci o poslovanju</a>
            <a href="/privatnost/">Privatnost i kolačići</a>
          </nav>
        </div>
      </div>
    </footer>

    <script src="/js/main.js?v=seo-404" defer></script>
    <script src="/js/analytics.js" defer data-privacy-href="/privatnost/"></script>
  </body>
</html>
