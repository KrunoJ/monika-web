<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marketing Hourglass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>
<!-- Marketing Hourglass mapa — embed za Hostinger Custom Code -->
<div class="mh-widget" id="mh-widget" data-mh-widget>
  <div class="mh-layout">
    <div class="mh-hourglass-wrap">
      <p class="mh-viz-title">Marketing Hourglass</p>
      <div class="mh-funnel-row">
        <div class="mh-axis" aria-hidden="true">
          <span class="mh-axis-label">široka publika</span>
          <svg class="mh-axis-arrow" viewBox="0 0 24 120" fill="none" aria-hidden="true">
            <line x1="12" y1="8" x2="12" y2="112" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M12 8 L8 16 M12 8 L16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M12 112 L8 104 M12 112 L16 104" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="mh-axis-label">lojalni ambasadori</span>
        </div>
        <div class="mh-glass">
          <svg class="mh-hourglass-svg" viewBox="0 0 280 400" preserveAspectRatio="xMidYMid meet" role="tablist" aria-label="Marketing Hourglass faze">
            <path d="M 23 0 H 257 Q 264 0 264 7 V 14 H 16 V 7 Q 16 0 23 0 Z" fill="#763317"/>
            <path d="M 16 386 H 264 V 393 Q 264 400 257 400 H 23 Q 16 400 16 393 Z" fill="#763317"/>
            <defs>
              <clipPath id="mh-glass-clip">
                <path d="M 16 14 H 264 L 248 74 L 232 136 L 180 198 L 232 260 L 248 322 L 264 386 H 16 L 32 322 L 48 260 L 100 198 L 48 136 L 32 74 Z"/>
              </clipPath>
            </defs>
            <g clip-path="url(#mh-glass-clip)" style="-webkit-clip-path: url(#mh-glass-clip);">
              <rect x="0" y="14" width="280" height="60" fill="#f3ddd4"/>
              <rect x="0" y="76" width="280" height="60" fill="#ebcab8"/>
              <rect x="0" y="138" width="280" height="60" fill="#ddb498"/>
              <rect x="0" y="200" width="280" height="60" fill="#d4dce6"/>
              <rect x="0" y="262" width="280" height="60" fill="#b8c5d4"/>
              <rect x="0" y="324" width="280" height="62" fill="#9aadc0"/>
              <rect x="0" y="74" width="280" height="2" fill="#fff"/>
              <rect x="0" y="136" width="280" height="2" fill="#fff"/>
              <rect x="0" y="198" width="280" height="2" fill="#fff"/>
              <rect x="0" y="260" width="280" height="2" fill="#fff"/>
              <rect x="0" y="322" width="280" height="2" fill="#fff"/>
            </g>
            <path class="mh-glass-stroke" fill="none" d="M 16 14 H 264 L 248 74 L 232 136 L 180 198 L 232 260 L 248 322 L 264 386 H 16 L 32 322 L 48 260 L 100 198 L 48 136 L 32 74 Z"/>
            <g class="mh-seg-hit" data-index="0" role="tab" aria-selected="true" tabindex="0">
              <path class="mh-seg-shape" d="M 16 14 H 264 L 248 74 H 32 Z"/>
              <text x="140" y="38" text-anchor="middle" class="mh-svg-name">awareness</text>
              <text x="140" y="56" text-anchor="middle" class="mh-svg-desc">Privuci pažnju</text>
            </g>
            <g class="mh-seg-hit" data-index="1" role="tab" aria-selected="false" tabindex="-1">
              <path class="mh-seg-shape" d="M 32 76 H 248 L 232 136 H 48 Z"/>
              <text x="140" y="100" text-anchor="middle" class="mh-svg-name">interest</text>
              <text x="140" y="118" text-anchor="middle" class="mh-svg-desc">Probudi interes</text>
            </g>
            <g class="mh-seg-hit" data-index="2" role="tab" aria-selected="false" tabindex="-1">
              <path class="mh-seg-shape" d="M 48 138 H 232 L 180 198 H 100 Z"/>
              <text x="140" y="162" text-anchor="middle" class="mh-svg-name">consideration</text>
              <text x="140" y="180" text-anchor="middle" class="mh-svg-desc">Izgradi povjerenje</text>
            </g>
            <g class="mh-seg-hit" data-index="3" role="tab" aria-selected="false" tabindex="-1">
              <path class="mh-seg-shape" d="M 100 200 H 180 L 232 260 H 48 Z"/>
              <text x="140" y="224" text-anchor="middle" class="mh-svg-name">purchase</text>
              <text x="140" y="242" text-anchor="middle" class="mh-svg-desc">Pomozi s odlukom</text>
            </g>
            <g class="mh-seg-hit" data-index="4" role="tab" aria-selected="false" tabindex="-1">
              <path class="mh-seg-shape" d="M 48 262 H 232 L 248 322 H 32 Z"/>
              <text x="140" y="286" text-anchor="middle" class="mh-svg-name">retention</text>
              <text x="140" y="302" text-anchor="middle" class="mh-svg-desc mh-svg-desc--sm">Zadrži klijente i</text>
              <text x="140" y="314" text-anchor="middle" class="mh-svg-desc mh-svg-desc--sm">njeguj odnos</text>
            </g>
            <g class="mh-seg-hit" data-index="5" role="tab" aria-selected="false" tabindex="-1">
              <path class="mh-seg-shape" d="M 32 324 H 248 L 264 386 H 16 L 32 324 Z"/>
              <text x="140" y="348" text-anchor="middle" class="mh-svg-name">advocacy</text>
              <text x="140" y="366" text-anchor="middle" class="mh-svg-desc">Potiči preporuke</text>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <div class="mh-card" role="tabpanel" aria-live="polite">
      <div class="mh-card-icons" aria-hidden="true"></div>
      <p class="mh-card-phase" id="mh-card-phase"></p>
      <h3 class="mh-card-title" id="mh-card-title"></h3>
      <p class="mh-card-subtitle" id="mh-card-subtitle"></p>

      <div class="mh-block">
        <h4 class="mh-block-label">Što se događa u glavi kupca?</h4>
        <p class="mh-block-text" id="mh-mind"></p>
      </div>

      <div class="mh-highlight">
        <h4 class="mh-block-label">Što treba osjetiti?</h4>
        <p class="mh-highlight-text" id="mh-feel"></p>
      </div>

      <div class="mh-columns">
        <div class="mh-col">
          <h4 class="mh-block-label">Što trebaš imati postavljeno?</h4>
          <ul class="mh-list mh-list--check" id="mh-setup"></ul>
        </div>
        <div class="mh-col">
          <h4 class="mh-block-label">Što najčešće nedostaje?</h4>
          <p class="mh-block-text" id="mh-missing"></p>
        </div>
      </div>

      <div class="mh-focus">
        <span class="mh-focus-label">Fokus:</span>
        <span class="mh-focus-text" id="mh-focus"></span>
      </div>

      <div class="mh-nav">
        <button type="button" class="mh-btn mh-btn--ghost" id="mh-prev" disabled>← Prethodna faza</button>
        <button type="button" class="mh-btn mh-btn--primary" id="mh-next">Sljedeća faza →</button>
      </div>
    </div>
  </div>
</div>

<style>
  .mh-widget,
  .mh-widget *,
  .mh-widget *::before,
  .mh-widget *::after {
    box-sizing: border-box;
  }

  .mh-widget {
    --mh-brown: #763317;
    --mh-terracotta: #a45f43;
    --mh-sage: #7f92a6;
    --mh-bg: #fbf7f3;
    --mh-card: #ffffff;
    --mh-text: #3b2418;
    --mh-radius: 14px;
    --mh-transition: 0.28s ease;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    color: var(--mh-text);
    background: var(--mh-bg);
    padding: clamp(1.25rem, 3vw, 2rem);
    border-radius: var(--mh-radius);
    max-width: 1200px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .mh-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(1.25rem, 3vw, 2rem);
    align-items: stretch;
  }

  .mh-hourglass-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-self: stretch;
    min-height: 100%;
  }

  .mh-viz-title {
    margin: 0 0 1rem;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mh-brown);
    text-align: center;
    flex-shrink: 0;
  }

  .mh-funnel-row {
    display: flex;
    align-items: stretch;
    gap: 0.75rem;
    flex: 1 1 auto;
    height: 100%;
    min-height: 0;
  }

  .mh-axis {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 5rem;
    flex-shrink: 0;
    padding: 2rem 0;
  }

  .mh-axis-label {
    font-size: 0.62rem;
    line-height: 1.25;
    text-align: center;
    color: var(--mh-brown);
    max-width: 4.25rem;
  }

  .mh-axis-arrow {
    width: 1.1rem;
    flex: 1;
    min-height: 5rem;
    color: var(--mh-brown);
    opacity: 0.75;
  }

  .mh-glass {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    min-width: 0;
    height: 100%;
    min-height: 0;
    max-width: 90%;
    margin: 0 auto;
    position: relative;
  }

  .mh-hourglass-svg {
    width: 100%;
    height: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: block;
    overflow: visible;
    font-family: Inter, system-ui, -apple-system, sans-serif;
  }

  .mh-glass-stroke {
    fill: none;
    stroke: rgba(118, 51, 23, 0.14);
    stroke-width: 1.2;
    pointer-events: none;
  }

  .mh-seg-hit {
    cursor: pointer;
  }

  .mh-seg-shape {
    fill: transparent;
    stroke: transparent;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
    transition: fill 0.28s ease, stroke 0.28s ease;
  }

  .mh-seg-hit:hover .mh-seg-shape {
    fill: rgba(59, 36, 24, 0.04);
  }

  .mh-seg-hit[aria-selected="true"] .mh-seg-shape {
    fill: rgba(118, 51, 23, 0.08);
    stroke: var(--mh-brown);
    stroke-width: 1.5;
  }

  .mh-seg-hit:focus {
    outline: none;
  }

  .mh-seg-hit:focus-visible .mh-seg-shape {
    stroke: var(--mh-brown);
  }

  .mh-svg-name {
    fill: var(--mh-text);
    font-size: 14px;
    font-weight: 700;
    pointer-events: none;
  }

  .mh-svg-desc {
    fill: var(--mh-text);
    font-size: 10px;
    opacity: 0.82;
    pointer-events: none;
  }

  .mh-svg-desc--sm {
    font-size: 8.5px;
  }

  .mh-card {
    background: var(--mh-card);
    border: 1px solid rgba(59, 36, 24, 0.08);
    border-radius: var(--mh-radius);
    padding: clamp(1.1rem, 2.5vw, 1.75rem);
    box-shadow: 0 12px 32px rgba(59, 36, 24, 0.06);
    transition: opacity var(--mh-transition);
    height: fit-content;
  }

  .mh-card.is-updating { opacity: 0.55; }

  .mh-card-icons {
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid rgba(59, 36, 24, 0.08);
  }

  .mh-icon-pill {
    width: 2.1rem;
    height: 2.1rem;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: rgba(127, 146, 166, 0.12);
    color: var(--mh-sage);
    transition: background var(--mh-transition), color var(--mh-transition), transform var(--mh-transition);
  }

  .mh-icon-pill.is-active {
    background: rgba(164, 95, 67, 0.16);
    color: var(--mh-terracotta);
    transform: scale(1.05);
  }

  .mh-icon-pill svg {
    width: 1rem;
    height: 1rem;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .mh-card-phase {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mh-terracotta);
    margin: 0 0 0.35rem;
  }

  .mh-card-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.35rem, 2.5vw, 1.75rem);
    font-weight: 700;
    color: var(--mh-brown);
    margin: 0 0 0.35rem;
    line-height: 1.2;
  }

  .mh-card-subtitle {
    margin: 0 0 1.1rem;
    color: rgba(59, 36, 24, 0.78);
    font-size: 0.95rem;
  }

  .mh-block { margin-bottom: 1rem; }

  .mh-block-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--mh-sage);
    margin: 0 0 0.45rem;
  }

  .mh-block-text {
    margin: 0;
    font-size: 0.95rem;
  }

  .mh-highlight {
    background: rgba(127, 146, 166, 0.1);
    border-left: 3px solid var(--mh-sage);
    border-radius: 0 10px 10px 0;
    padding: 0.85rem 1rem;
    margin-bottom: 1rem;
  }

  .mh-highlight-text {
    margin: 0;
    font-weight: 600;
    color: var(--mh-brown);
    font-size: 1rem;
  }

  .mh-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .mh-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 0.45rem;
  }

  .mh-list li {
    position: relative;
    padding-left: 1.2rem;
    font-size: 0.92rem;
  }

  .mh-list--check li::before {
    content: "✓";
    position: absolute;
    left: 0;
    color: var(--mh-terracotta);
    font-weight: 700;
  }

  .mh-focus {
    background: rgba(164, 95, 67, 0.08);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 1.25rem;
    font-size: 0.95rem;
  }

  .mh-focus-label {
    font-weight: 700;
    color: var(--mh-terracotta);
    margin-right: 0.35rem;
  }

  .mh-nav {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .mh-btn {
    border: none;
    border-radius: 8px;
    padding: 0.7rem 1rem;
    font: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--mh-transition), color var(--mh-transition), opacity var(--mh-transition), transform var(--mh-transition);
  }

  .mh-btn:focus-visible {
    outline: 2px solid var(--mh-terracotta);
    outline-offset: 2px;
  }

  .mh-btn--primary {
    background: var(--mh-brown);
    color: #fff;
    margin-left: auto;
  }

  .mh-btn--primary:hover:not(:disabled) {
    background: var(--mh-terracotta);
    transform: translateY(-1px);
  }

  .mh-btn--ghost {
    background: transparent;
    color: var(--mh-brown);
    border: 1px solid rgba(118, 51, 23, 0.25);
  }

  .mh-btn--ghost:hover:not(:disabled) {
    background: rgba(118, 51, 23, 0.06);
  }

  .mh-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  @media (max-width: 860px) {
    .mh-layout {
      grid-template-columns: 1fr;
    }

    .mh-hourglass-wrap {
      max-width: min(100%, 400px);
      margin: 0 auto 0.5rem;
      min-height: 468px;
    }

    .mh-funnel-row { gap: 0.5rem; }
    .mh-axis { width: 3.75rem; padding: 1.25rem 0; }
    .mh-axis-label { font-size: 0.58rem; }

    .mh-columns {
      grid-template-columns: 1fr;
    }

    .mh-nav {
      flex-direction: column;
    }

    .mh-btn--primary { margin-left: 0; }
  }
</style>

<script>
(function () {
  var ICONS = {
    awareness: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',
    interest: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>',
    consideration: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    purchase: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/><path d="M2 3h2l2.2 11.4a2 2 0 0 0 2 1.6h9.6a2 2 0 0 0 2-1.6L22 7H6"/></svg>',
    retention: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>',
    advocacy: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
  };

  var PHASES = [
    {
      id: "awareness",
      name: "Awareness",
      desc: "Ljudi te još ne poznaju",
      funnelTag: "Privuci pažnju",
      mind: "Osoba te upravo otkriva. Još ne zna tko si, što radiš ni zašto bi te trebala pratiti.",
      feel: "\"Ovo je relevantno za mene.\"",
      setup: ["jasnu komunikaciju", "sadržaj koji privlači prave ljude", "prepoznatljivu temu i pozicioniranje", "kanale na kojima te ljudi mogu pronaći"],
      missing: "Ljudi objavljuju sadržaj, ali nije jasno kome se obraćaju ni zašto bi ih netko zapamtio.",
      focus: "Budi pronađena i prepoznatljiva."
    },
    {
      id: "interest",
      name: "Interest",
      desc: "Zainteresirali su se",
      funnelTag: "Probudi interes",
      mind: "Počinje te pratiti, čitati i istraživati.",
      feel: "\"Ova osoba razumije moj problem.\"",
      setup: ["koristan sadržaj", "jasne poruke", "prve točke interakcije", "razlog da ostane u tvojem svijetu"],
      missing: "Sadržaj postoji, ali ne stvara dovoljno interesa za sljedeći korak.",
      focus: "Pretvori pažnju u interes."
    },
    {
      id: "consideration",
      name: "Consideration",
      desc: "Razmišljaju o tebi",
      funnelTag: "Izgradi povjerenje",
      mind: "Uspoređuje te s drugim opcijama i procjenjuje imaš li rješenje za njegov problem.",
      feel: "\"Mogu vjerovati ovoj osobi.\"",
      setup: ["newsletter", "lead magnet", "primjere rada", "rezultate", "testimonials"],
      missing: "Ljudi vide sadržaj, ali nemaju dovoljno razloga da ti ostave kontakt ili naprave sljedeći korak.",
      focus: "Izgradi povjerenje."
    },
    {
      id: "purchase",
      name: "Purchase",
      desc: "Donose odluku",
      funnelTag: "Pomozi s odlukom",
      mind: "Razmišlja o kupnji, ali još uvijek procjenjuje rizik.",
      feel: "\"Ovo ima smisla za mene.\"",
      setup: ["jasne ponude", "jednostavan proces kupnje", "prodajne sekvence", "odgovore na najčešće sumnje"],
      missing: "Dobar sadržaj, ali loš prijelaz prema ponudi.",
      focus: "Olakšaj donošenje odluke."
    },
    {
      id: "retention",
      name: "Retention",
      desc: "Postali su klijenti",
      funnelTag: "Zadrži klijente i njeguj odnos",
      mind: "Kupnja je završila. Sada procjenjuje je li odluka bila dobra.",
      feel: "\"Drago mi je što sam kupio.\"",
      setup: ["onboarding", "follow-up komunikaciju", "customer experience", "dodatnu podršku"],
      missing: "Komunikacija staje odmah nakon kupnje.",
      focus: "Ispuni obećanje."
    },
    {
      id: "advocacy",
      name: "Advocacy",
      desc: "Preporučuju te drugima",
      funnelTag: "Potiči preporuke",
      mind: "Kupac postaje ambasador.",
      feel: "\"Ovo želim preporučiti drugima.\"",
      setup: ["sustav za preporuke", "traženje feedbacka", "ponovne kupnje", "community elemente"],
      missing: "Poslovanje nikad ne iskoristi zadovoljstvo postojećih kupaca.",
      focus: "Pretvori kupce u ambasadore."
    }
  ];

  var root = document.querySelector("[data-mh-widget]");
  if (!root) return;

  var hourglass = root.querySelector(".mh-hourglass-svg");
  var funnelRow = root.querySelector(".mh-funnel-row");
  var segHits = root.querySelectorAll(".mh-seg-hit");
  var iconsRow = root.querySelector(".mh-card-icons");
  var card = root.querySelector(".mh-card");
  var prevBtn = root.querySelector("#mh-prev");
  var nextBtn = root.querySelector("#mh-next");
  var active = 0;
  var layoutHeight = 0;

  function el(id) { return root.querySelector("#" + id); }

  function applyPhase(index, animate) {
    var phase = PHASES[index];
    if (animate) {
      card.classList.add("is-updating");
      window.setTimeout(function () {
        card.classList.remove("is-updating");
      }, 180);
    }

    root.querySelectorAll(".mh-seg-hit").forEach(function (seg, i) {
      var isActive = i === index;
      seg.setAttribute("aria-selected", isActive ? "true" : "false");
      seg.setAttribute("tabindex", isActive ? "0" : "-1");
    });

    root.querySelectorAll(".mh-icon-pill").forEach(function (pill, i) {
      pill.classList.toggle("is-active", i === index);
    });

    card.setAttribute("aria-labelledby", "mh-tab-" + phase.id);
    el("mh-card-phase").textContent = phase.name;
    el("mh-card-title").textContent = phase.name;
    el("mh-card-subtitle").textContent = phase.desc;
    el("mh-mind").textContent = phase.mind;
    el("mh-feel").textContent = phase.feel;
    el("mh-missing").textContent = phase.missing;
    el("mh-focus").textContent = phase.focus;

    var setupList = el("mh-setup");
    setupList.innerHTML = "";
    phase.setup.forEach(function (item) {
      var li = document.createElement("li");
      li.textContent = item;
      setupList.appendChild(li);
    });

    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === PHASES.length - 1;
  }

  function measureMaxCardHeight() {
    var max = 0;
    var prev = active;
    for (var i = 0; i < PHASES.length; i++) {
      applyPhase(i, false);
      max = Math.max(max, card.offsetHeight);
    }
    applyPhase(prev, false);
    return max;
  }

  function syncFunnelHeight() {
    if (!funnelRow || !card) return;
    if (window.innerWidth <= 860) {
      card.style.minHeight = "";
      funnelRow.style.minHeight = "";
      return;
    }
    if (!layoutHeight) {
      layoutHeight = measureMaxCardHeight();
    }
    card.style.minHeight = layoutHeight + "px";
    var title = root.querySelector(".mh-viz-title");
    var titleSpace = 0;
    if (title) {
      var titleStyle = window.getComputedStyle(title);
      titleSpace = title.offsetHeight + parseFloat(titleStyle.marginBottom);
    }
    funnelRow.style.minHeight = Math.max(0, (layoutHeight - titleSpace) * 0.9) + "px";
  }

  segHits.forEach(function (seg, index) {
    seg.id = "mh-tab-" + PHASES[index].id;
    seg.setAttribute("aria-controls", "mh-card-panel");
    seg.addEventListener("click", function () { setActive(index); });
    seg.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        setActive(index);
      }
    });
  });

  PHASES.forEach(function (phase, index) {
    var pill = document.createElement("span");
    pill.className = "mh-icon-pill" + (index === 0 ? " is-active" : "");
    pill.innerHTML = ICONS[phase.id];
    iconsRow.appendChild(pill);
  });

  card.id = "mh-card-panel";
  card.setAttribute("aria-labelledby", "mh-tab-awareness");

  function setActive(index) {
    if (index < 0 || index >= PHASES.length) return;
    active = index;
    applyPhase(index, true);
  }

  prevBtn.addEventListener("click", function () { setActive(active - 1); });
  nextBtn.addEventListener("click", function () { setActive(active + 1); });

  root.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { e.preventDefault(); setActive(active - 1); }
    if (e.key === "ArrowRight") { e.preventDefault(); setActive(active + 1); }
  });

  setActive(0);
  syncFunnelHeight();
  window.addEventListener("resize", function () {
    layoutHeight = 0;
    syncFunnelHeight();
  });
})();
</script>

<script>
(function () {
  function notifyHeight() {
    var root = document.querySelector("[data-mh-widget]");
    if (!root) return;
    var h = Math.ceil(root.getBoundingClientRect().height + 8);
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "mh-hourglass-height", height: h }, "*");
    }
  }
  window.addEventListener("load", function () {
    notifyHeight();
    setTimeout(notifyHeight, 100);
    setTimeout(notifyHeight, 400);
  });
  window.addEventListener("resize", notifyHeight);
  document.addEventListener("click", function () { setTimeout(notifyHeight, 220); });
})();
</script>
</body>
</html>
