      </div>

        <h4 class="mh-block-label">Što trebaš imati postavljeno?</h4>
        <ul class="mh-list mh-list--check" id="mh-setup"></ul>
      </div>

        <h4 class="mh-block-label">Gdje najčešće zapinje?</h4>
        <div class="mh-diagnose-text" id="mh-stuck"></div>
      </div>

        <button type="button" class="mh-btn mh-btn--primary" id="mh-next">Sljedeća faza →</button>
      </div>
    </div>

</div>

<style>
  .mh-widget,
  .mh-widget *,
  .mh-widget *::before,
  .mh-widget *::after { box-sizing: border-box; }

  .mh-widget {
    --mh-brown: #763317;
    --mh-terracotta: #a45f43;
    --mh-sage: #7f92a6;
    --mh-bg: #fbf7f3;
    --mh-card: #ffffff;
    --mh-text: #3b2418;
    --mh-radius: 14px;
    --mh-transition: 0.28s ease;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    color: var(--mh-text);
    background: var(--mh-bg);
    padding: clamp(0.85rem, 2vw, 1.35rem);
    border-radius: var(--mh-radius);
    max-width: 1080px;
    margin: 0 auto;
    line-height: 1.55;
  }

  .mh-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(0.75rem, 2vw, 1.25rem);
    align-items: stretch;
  }

  .mh-hourglass-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-self: stretch;
    min-height: 100%;
  }

  .mh-viz-title {
    margin: 0 0 0.65rem;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mh-brown);
    text-align: center;
    flex-shrink: 0;
  }

  .mh-funnel-row {
    display: flex;
    align-items: stretch;
    gap: 0.55rem;
    flex: 1 1 auto;
    height: 100%;
    min-height: 0;
  }

  .mh-axis {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 4.25rem;
    flex-shrink: 0;
    padding: 1.5rem 0;
  }

  .mh-axis-label {
    font-size: 0.62rem;
    line-height: 1.25;
    text-align: center;
    color: var(--mh-brown);
    max-width: 4.25rem;
  }

  .mh-axis-arrow {
    width: 1.1rem;
    max-width: 1.1rem;
    flex: 1;
    min-height: 5rem;
    color: var(--mh-brown);
    opacity: 0.75;
    display: block;
  }

  .mh-glass {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100%;
    min-height: 0;
    max-width: 84%;
    margin: 0 auto;
    position: relative;
  }

  .mh-hourglass-svg {
    width: 100%;
    height: auto;
    aspect-ratio: 280 / 400;
    max-width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: block;
    overflow: visible;
    font-family: Inter, system-ui, -apple-system, sans-serif;
  }

  .mh-glass-stroke {
    fill: none !important;
    stroke: rgba(118, 51, 23, 0.14);
    stroke-width: 1.2;
    pointer-events: none;
  }

  .mh-seg-hit { cursor: pointer; }

  .mh-seg-shape {
    fill: transparent;
    stroke: transparent;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
    pointer-events: all;
    transition: fill 0.28s ease, stroke 0.28s ease;
  }

  .mh-seg-hit:hover .mh-seg-shape { fill: rgba(59, 36, 24, 0.04); }
  .mh-seg-hit[aria-selected="true"] .mh-seg-shape {
    fill: rgba(118, 51, 23, 0.08);
    stroke: var(--mh-brown);
  }
  .mh-seg-hit:focus { outline: none; }
  .mh-seg-hit:focus-visible .mh-seg-shape { stroke: var(--mh-brown); }

  .mh-svg-name { fill: var(--mh-text); font-size: 11.5px; font-weight: 700; pointer-events: none; }
  .mh-svg-desc { fill: var(--mh-text); font-size: 9px; opacity: 0.82; pointer-events: none; }
  .mh-svg-desc--sm { font-size: 8px; }

  .mh-card {
    background: var(--mh-card);
    border: 1px solid rgba(59, 36, 24, 0.08);
    border-radius: var(--mh-radius);
    padding: clamp(0.85rem, 1.8vw, 1.2rem);
    box-shadow: 0 1px 2px rgba(59, 36, 24, 0.04);
    transition: opacity var(--mh-transition);
    height: fit-content;
  }

  .mh-card.is-updating { opacity: 0.55; }

  .mh-card-icons {
    display: flex;
    gap: 0.4rem;
    flex-wrap: nowrap;
    margin-bottom: 0.65rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid rgba(59, 36, 24, 0.08);
  }

  .mh-icon-pill {
    width: 2.35rem;
    height: 2.35rem;
    min-width: 2.35rem;
    border: 0;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: rgba(127, 146, 166, 0.12);
    color: var(--mh-sage);
    cursor: pointer;
    padding: 0;
    transition: background var(--mh-transition), color var(--mh-transition), transform var(--mh-transition);
  }

  .mh-icon-pill:hover { background: rgba(127, 146, 166, 0.2); }
  .mh-icon-pill.is-active {
    background: rgba(164, 95, 67, 0.16);
    color: var(--mh-terracotta);
    transform: scale(1.05);
  }
  .mh-icon-pill:focus-visible {
    outline: 2px solid var(--mh-terracotta);
    outline-offset: 2px;
  }

  .mh-icon-pill svg {
    width: 1rem;
    height: 1rem;
    max-width: 1rem;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .mh-card-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.25rem, 2.2vw, 1.55rem);
    font-weight: 700;
    color: var(--mh-brown);
    margin: 0 0 0.65rem;
    line-height: 1.15;
  }

  .mh-block { margin-bottom: 0.65rem; }

  .mh-block-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--mh-sage);
    margin: 0 0 0.35rem;
  }

  .mh-block-text,
  .mh-diagnose-text {
    margin: 0;
    font-size: 0.92rem;
  }

  .mh-block-text p,
  .mh-diagnose-text p {
    margin: 0 0 0.55rem;
  }

  .mh-block-text p:last-child,
  .mh-diagnose-text p:last-child { margin-bottom: 0; }

  .mh-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 0.35rem;
  }

  .mh-list li {
    position: relative;
    padding-left: 1.15rem;
    font-size: 0.9rem;
    line-height: 1.4;
  }

  .mh-list--check li::before {
    content: "✓";
    position: absolute;
    left: 0;
    color: var(--mh-terracotta);
    font-weight: 700;
  }

  .mh-diagnose {
    background: rgba(127, 146, 166, 0.1);
    border-left: 3px solid var(--mh-sage);
    border-radius: 0 10px 10px 0;
    padding: 0.65rem 0.8rem;
    margin-bottom: 0.85rem;
  }

  .mh-diagnose .mh-block-label { color: var(--mh-brown); }

  .mh-diagnose-text strong,
  .mh-block-text strong {
    font-weight: 700;
    color: var(--mh-brown);
  }

  .mh-nav {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .mh-btn {
    border: none;
    border-radius: 8px;
    padding: 0.55rem 0.85rem;
    font: inherit;
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--mh-transition), color var(--mh-transition), opacity var(--mh-transition), transform var(--mh-transition);
  }

  .mh-btn:focus-visible {
    outline: 2px solid var(--mh-terracotta);
    outline-offset: 2px;
  }

  .mh-btn--primary {
    background: var(--mh-brown);
    color: #fff;
    margin-left: auto;
  }

  .mh-btn--primary:hover:not(:disabled) {
    background: var(--mh-terracotta);
    transform: translateY(-1px);
  }

  .mh-btn--ghost {
    background: transparent;
    color: var(--mh-brown);
    border: 1px solid rgba(118, 51, 23, 0.25);
  }

  .mh-btn--ghost:hover:not(:disabled) {
    background: rgba(118, 51, 23, 0.06);
  }

  .mh-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  @media (max-width: 860px) {
    .mh-layout { grid-template-columns: 1fr; }
    .mh-hourglass-wrap {
      max-width: min(100%, 400px);
      margin: 0 auto 0.5rem;
      min-height: 420px;
    }
    .mh-funnel-row { gap: 0.5rem; }
    .mh-axis { width: 3.75rem; padding: 1.25rem 0; }
    .mh-axis-label { font-size: 0.58rem; }
    .mh-nav { flex-direction: column; }
    .mh-btn--primary { margin-left: 0; }
    .mh-card-icons { gap: 0.3rem; }
    .mh-icon-pill {
      width: 2.75rem;
      height: 2.75rem;
      min-width: 2.75rem;
      min-height: 2.75rem;
      flex: 1 1 0;
    }
  }
</style>

    },
    {
      id: "retention",
      name: "Povratak",
      happen: ["Kupnja je završila, ali korisnički put nije. Osoba sada kroz stvarno iskustvo procjenjuje je li donijela dobru odluku i želi li ostati povezana s tobom."],
      setup: [
        "jasan onboarding i iskustvo nakon kupnje",
        "komunikaciju i podršku tijekom i nakon korištenja proizvoda ili usluge",
        "smislen način za nastavak odnosa i ponovnu kupnju"
      ],
      stuck: [
        "Puno pažnje ulažeš u privlačenje i prodaju, a nakon kupnje <strong>komunikacija naglo stane</strong>.",
        "Klijent dobije ono što je platio, ali nema promišljenog onboardinga, follow-upa ili razloga da ostane povezan s tobom. Tako svaki novi prihod ponovno ovisi prvenstveno o pronalaženju novih ljudi, umjesto i o odnosima koje si već izgradila."
      ]
    },
    {
      id: "advocacy",
      name: "Lojalnost",
      happen: ["Zadovoljan kupac više nije samo kupac. Ima vlastito iskustvo s tobom koje može podijeliti, preporučiti te drugima i postati jedan od razloga zbog kojih novi ljudi ulaze u tvoj prodajni lijevak."],
      setup: [
        "način za prikupljanje feedbacka i testimoniala",
        "prirodne prilike za preporuke",
        "nastavak odnosa s postojećim i bivšim klijentima"
      ],
      stuck: [
        "Klijenti su zadovoljni, ali poslovanje to zadovoljstvo <strong>gotovo uopće ne koristi</strong>.",
        "Ne tražiš feedback, nemaš trenutak u kojem prirodno potičeš preporuku ili nakon završetka suradnje potpuno nestaneš iz njihova svijeta. Dobra iskustva postoje, ali ostaju privatna.",
        "A upravo preporuka zadovoljnog klijenta može novoj osobi skratiti nekoliko prethodnih faza jer povjerenje ne gradiš više samo ti."
      ]
    }
  ];

  var root = document.querySelector("[data-mh-widget]");
  if (!root) return;

  var funnelRow = root.querySelector(".mh-funnel-row");
  var segHits = root.querySelectorAll(".mh-seg-hit");
  var iconsRow = root.querySelector(".mh-card-icons");
  var card = root.querySelector(".mh-card");
  var prevBtn = root.querySelector("#mh-prev");
  var nextBtn = root.querySelector("#mh-next");
  var active = 0;
  var layoutHeight = 0;

  function el(id) { return root.querySelector("#" + id); }

  function setHtmlParagraphs(target, paragraphs) {
    target.innerHTML = "";
    paragraphs.forEach(function (text) {
      var p = document.createElement("p");
      p.innerHTML = text;
      target.appendChild(p);
    });
  }

  function applyPhase(index, animate) {
    var phase = PHASES[index];
    if (animate) {
      card.classList.add("is-updating");
      window.setTimeout(function () {
        card.classList.remove("is-updating");
      }, 180);
    }

    root.querySelectorAll(".mh-seg-hit").forEach(function (seg, i) {
      var isActive = i === index;
      seg.setAttribute("aria-selected", isActive ? "true" : "false");
      seg.setAttribute("tabindex", isActive ? "0" : "-1");
    });

    root.querySelectorAll(".mh-icon-pill").forEach(function (pill, i) {
      var isActive = i === index;
      pill.classList.toggle("is-active", isActive);
      pill.setAttribute("aria-selected", isActive ? "true" : "false");
      pill.tabIndex = 0;
    });

    card.setAttribute("aria-labelledby", "mh-tab-" + phase.id);
    el("mh-card-title").textContent = phase.name;
    setHtmlParagraphs(el("mh-happen"), phase.happen);
    setHtmlParagraphs(el("mh-stuck"), phase.stuck);

    var setupList = el("mh-setup");
    setupList.innerHTML = "";
    phase.setup.forEach(function (item) {
      var li = document.createElement("li");
      li.textContent = item;
      setupList.appendChild(li);
    });

    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === PHASES.length - 1;
  }

  function measureMaxCardHeight() {
    var max = 0;
    var prev = active;
    for (var i = 0; i < PHASES.length; i++) {
      applyPhase(i, false);
      max = Math.max(max, card.offsetHeight);
    }
    applyPhase(prev, false);
    return max;
  }

  function syncFunnelHeight() {
    if (!funnelRow || !card) return;
    if (window.innerWidth <= 860) {
      card.style.minHeight = "";
      funnelRow.style.minHeight = "";
      return;
    }
    if (!layoutHeight) layoutHeight = measureMaxCardHeight();
    card.style.minHeight = layoutHeight + "px";
    var title = root.querySelector(".mh-viz-title");
    var titleSpace = 0;
    if (title) {
      var titleStyle = window.getComputedStyle(title);
      titleSpace = title.offsetHeight + parseFloat(titleStyle.marginBottom);
    }
    funnelRow.style.minHeight = Math.max(0, (layoutHeight - titleSpace) * 0.9) + "px";
  }

  function notifyHeight() {
    var h = Math.ceil(root.getBoundingClientRect().height + 8);
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "mh-hourglass-height", height: h }, "*");
    }
  }

  function setActive(index) {
    if (index < 0 || index >= PHASES.length) return;
    active = index;
    applyPhase(index, true);
    layoutHeight = 0;
    syncFunnelHeight();
    notifyHeight();
  }

  segHits.forEach(function (seg, index) {
    seg.id = "mh-tab-" + PHASES[index].id;
    seg.setAttribute("aria-label", PHASES[index].name);
    seg.setAttribute("aria-controls", "mh-card-panel");
    seg.addEventListener("click", function () { setActive(index); });
    seg.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        setActive(index);
      }
    });
  });

  PHASES.forEach(function (phase, index) {
    var pill = document.createElement("button");
    pill.type = "button";
    pill.className = "mh-icon-pill" + (index === 0 ? " is-active" : "");
    pill.setAttribute("role", "tab");
    pill.setAttribute("aria-selected", index === 0 ? "true" : "false");
    pill.setAttribute("aria-controls", "mh-card-panel");
    pill.setAttribute("aria-label", phase.name);
    pill.title = phase.name;
    pill.tabIndex = 0;
    pill.innerHTML = ICONS[phase.id];
    pill.addEventListener("click", function () { setActive(index); });
    iconsRow.appendChild(pill);
  });

  prevBtn.addEventListener("click", function () { setActive(active - 1); });
  nextBtn.addEventListener("click", function () { setActive(active + 1); });

  root.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { e.preventDefault(); setActive(active - 1); }
    if (e.key === "ArrowRight") { e.preventDefault(); setActive(active + 1); }
  });

  setActive(0);
  syncFunnelHeight();
  notifyHeight();
  window.addEventListener("resize", function () {
    layoutHeight = 0;
    syncFunnelHeight();
    notifyHeight();
  });
  window.addEventListener("load", function () {
    setTimeout(notifyHeight, 100);
    setTimeout(notifyHeight, 400);
  });
})();
</script>
</body>
</html>
